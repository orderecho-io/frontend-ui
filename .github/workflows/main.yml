name: Deploy Frontend

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Install dependencies
      run: |
        echo "Current directory: $(pwd)"
        echo "Files in current directory:"
        ls -la
        echo "Looking for package.json..."
        if [ -f package.json ]; then
          echo "Found package.json"
          if [ -f package-lock.json ]; then
            echo "Found package-lock.json, using npm ci"
            npm ci
          else
            echo "No package-lock.json, using npm install"
            npm install
          fi
        else
          echo "ERROR: package.json not found in current directory"
          exit 1
        fi
      
    - name: Run tests
      run: |
        # Add your frontend tests here
        echo "Frontend tests would run here"
        
    - name: Build frontend
      run: npm run build
      
    - name: Deploy frontend to server
      if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
      env:
        SERVER_IP: ${{ secrets.SERVER_IP }}
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        SERVER_USER: ${{ secrets.SERVER_USER }}
      run: |
        # Setup SSH
        mkdir -p ~/.ssh
        echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        ssh-keyscan -H $SERVER_IP >> ~/.ssh/known_hosts
        
        # Deploy frontend build
        rsync -avz --delete dist/ $SERVER_USER@$SERVER_IP:/var/www/orderecho/
        
        # Reload nginx
        ssh $SERVER_USER@$SERVER_IP "sudo systemctl reload nginx"
        
    - name: Verify frontend deployment
      if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
      env:
        SERVER_IP: ${{ secrets.SERVER_IP }}
      run: |
        # Check frontend
        curl -f http://$SERVER_IP/ || exit 1
        
        echo "✅ Frontend deployment verified successfully!"
