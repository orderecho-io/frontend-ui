name: Deploy Frontend

on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  deploy-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./order-echo
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run tests
      run: |
        # Add your frontend tests here
        echo "Frontend tests would run here"
        
    - name: Build frontend
      run: npm run build
      
    - name: Deploy frontend to server
      if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
      env:
        SERVER_IP: ${{ secrets.SERVER_IP }}
        SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        SERVER_USER: ${{ secrets.SERVER_USER }}
      working-directory: ./
      run: |
        # Setup SSH
        mkdir -p ~/.ssh
        
        # Write SSH key and fix line endings
        echo "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/id_rsa
        chmod 600 ~/.ssh/id_rsa
        
        # Debug: Check key format
        echo "Checking SSH key format..."
        head -1 ~/.ssh/id_rsa
        tail -1 ~/.ssh/id_rsa
        
        # Debug: Check environment variables
        echo "Server IP: $SERVER_IP"
        echo "Server User: $SERVER_USER"
        
        # Add server to known hosts
        if [ -n "$SERVER_IP" ]; then
          ssh-keyscan -H "$SERVER_IP" >> ~/.ssh/known_hosts
        else
          echo "ERROR: SERVER_IP is not set"
          exit 1
        fi
        
        # Test SSH connection
        echo "Testing SSH connection..."
        ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no -o BatchMode=yes $SERVER_USER@$SERVER_IP "echo 'SSH connection successful'"
        
        # Temporarily change ownership to ec2-user for deployment
        echo "Setting deployment permissions..."
        ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP "sudo chown -R ec2-user:ec2-user /var/www/orderecho"
        
        # Deploy frontend build
        echo "Deploying frontend files..."
        rsync -avz --delete -e "ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no" \
          order-echo/dist/ $SERVER_USER@$SERVER_IP:/var/www/orderecho/
        
        # Change ownership back to nginx
        echo "Restoring nginx ownership..."
        ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP "sudo chown -R nginx:nginx /var/www/orderecho && sudo chmod -R 755 /var/www/orderecho"
        
        # Reload nginx
        echo "Reloading nginx..."
        ssh -i ~/.ssh/id_rsa -o StrictHostKeyChecking=no $SERVER_USER@$SERVER_IP "sudo systemctl reload nginx"
        
    - name: Verify frontend deployment
      if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
      env:
        SERVER_IP: ${{ secrets.SERVER_IP }}
      working-directory: ./
      run: |
        # Check frontend
        curl -f http://$SERVER_IP/ || exit 1
        
        echo "✅ Frontend deployment verified successfully!"
